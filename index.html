<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>MRzeroCloud GRE in Pyodide</title>
  <style>
    :root { --bg:#0a0e1a; --panel:#141b2d; --text:#e8ecff; --muted:#a9b3da; --border:rgba(255,255,255,.1); --accent:#3b82f6; }
    html,body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; }
    body { max-width:720px; margin:0 auto; padding:16px; }
    h1 { font-size:1.25rem; font-weight:600; color:var(--accent); }
    .hint,code { color:var(--muted); font-size:.9rem; }
    code { background:var(--panel); padding:.1em .35em; border-radius:4px; }
    #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
    button,input { color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:.4rem .7rem; }
    button { background:var(--accent); border:0; cursor:pointer; }
    button:disabled,input:disabled { opacity:.45; cursor:default; }
    #status { white-space:pre-wrap; background:var(--panel); border:1px solid var(--border); padding:.75rem 1rem; border-radius:8px; min-height:3rem; }
    #error { color:#f87171; white-space:pre-wrap; }
    #plots { display:flex; flex-wrap:wrap; gap:12px; }
    img { width:320px; max-width:100%; image-rendering:pixelated; background:#000; border:1px solid var(--border); border-radius:8px; }
  </style>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
</head>
<body>
  <h1>MRzeroCloud GRE (Pyodide)</h1>
  <p class="hint">
    Loads MRzeroCloud in the browser (Pyodide, no pip/git),
    runs a Pulseq <code>.seq</code> on the default modal backend
    (<code>128×128</code>, FOV 256 mm) and shows
    <code>reco_pynufft</code> magnitude and phase.
  </p>
  <div id="bar">
    <button id="gre" type="button" disabled>GRE example</button>
    <input id="upload" type="file" accept=".seq,text/plain" disabled>
  </div>
  <p id="status">Loading Pyodide…</p>
  <p id="error"></p>
  <div id="plots">
    <img id="recon" alt="magnitude" hidden>
    <img id="phase" alt="phase" hidden>
  </div>

  <script>
    const REPO_FALLBACKS = [
      "https://cdn.jsdelivr.net/gh/mrx-org/MRzeroCloud@main/",
      "https://raw.githubusercontent.com/mrx-org/MRzeroCloud/main/",
    ];
    const SEQ_FALLBACK = REPO_FALLBACKS.map((root) => root + "examples/gre.seq");
    const PACKAGE_FILES = [
      "MRzeroCloud/__init__.py",
      "MRzeroCloud/exceptions.py",
      "MRzeroCloud/reconstruction.py",
      "MRzeroCloud/simulation.py",
      "MRzeroCloud/util.py",
      "MRzeroCloud/api/__init__.py",
      "MRzeroCloud/api/_config.py",
      "MRzeroCloud/api/_io.py",
      "MRzeroCloud/api/_modal_http.py",
      "MRzeroCloud/api/_pulseq.py",
      "MRzeroCloud/api/_recon.py",
      "MRzeroCloud/api/_tools.py",
      "MRzeroCloud/api/pipeline.py",
    ];

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function errText(err) {
      if (err == null) return String(err);
      if (typeof err === "string") return err;
      if (err.message) return err.message;
      if (err.code || err.errno) return `${err.code || ""} ${err.errno || ""}`.trim();
      try { return JSON.stringify(err); } catch { return String(err); }
    }

    function packageRoots() {
      const here = new URL(".", window.location.href);
      return [
        here.href,
        new URL("../", here).href,
        ...REPO_FALLBACKS,
      ];
    }

    function mkdirParents(fs, filePath) {
      const parts = filePath.split("/").filter(Boolean).slice(0, -1);
      let cur = "";
      for (const part of parts) {
        cur = cur ? `${cur}/${part}` : part;
        try {
          fs.mkdir(cur);
        } catch (err) {
          if (err && (err.errno === 17 || err.errno === 20 || err.code === "EEXIST")) {
            continue;
          }
          throw err;
        }
      }
    }

    async function fetchText(url) {
      const resp = await fetch(url, { cache: "no-store" });
      if (!resp.ok) throw new Error(`${url}: ${resp.status}`);
      return await resp.text();
    }

    async function loadSeqText() {
      const here = new URL(".", window.location.href);
      const urls = [
        new URL("examples/gre.seq", here).href,
        new URL("gre.seq", here).href,
        ...SEQ_FALLBACK,
      ];
      let lastError;
      for (const url of urls) {
        try {
          return await fetchText(url);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError;
    }

    let pyodide = null;
    let busy = false;

    function setBusy(on) {
      busy = on;
      const ready = !!pyodide;
      document.getElementById("gre").disabled = !ready || on;
      document.getElementById("upload").disabled = !ready || on;
    }

    async function runSeq(seqText, label) {
      if (!pyodide || busy) return;
      setBusy(true);
      document.getElementById("error").textContent = "";
      try {
        pyodide.FS.writeFile("input.seq", seqText);
        setStatus("Simulating " + label + " on modal (page may pause while polling)…");
        await pyodide.runPythonAsync(`
from js import document
import io, base64, sys
sys.path.insert(0, ".")
import numpy as np
from PIL import Image
import MRzeroCloud as mr0

def on_message(msg):
    document.getElementById("status").textContent = str(msg)
    return True

mr0.api.configure(on_message=on_message, verbose=False)
signal, ktraj = mr0.simulate("input.seq")
image = mr0.reco_pynufft(
    signal,
    ktraj,
    resolution=(128, 128, 1),
    FOV=(0.256, 0.256, 0.003),
)
vol = np.squeeze(image)
mag = np.abs(vol).T[::-1]
phase = np.angle(vol).T[::-1]

def to_png(arr, lo, hi):
    pix = np.asarray(255.0 * (arr - lo) / ((hi - lo) or 1.0), dtype=np.uint8)
    buf = io.BytesIO()
    Image.fromarray(pix, mode="L").save(buf, format="PNG")
    return "data:image/png;base64," + base64.b64encode(buf.getvalue()).decode("ascii")

for el_id, src in (
    ("recon", to_png(mag, 0.0, float(mag.max()) or 1.0)),
    ("phase", to_png(phase, -np.pi, np.pi)),
):
    el = document.getElementById(el_id)
    el.src = src
    el.hidden = False
document.getElementById("status").textContent = (
    f"done: {signal.size} samples, image {mag.shape[0]}x{mag.shape[1]}"
)
        `);
      } catch (err) {
        document.getElementById("error").textContent = String(err);
        setStatus("Failed.");
      } finally {
        setBusy(false);
      }
    }

    document.getElementById("gre").onclick = async () => {
      try {
        setStatus("Fetching gre.seq…");
        await runSeq(await loadSeqText(), "gre.seq");
      } catch (err) {
        document.getElementById("error").textContent = String(err);
        setStatus("Failed.");
      }
    };

    document.getElementById("upload").onchange = async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      if (!file) return;
      try {
        await runSeq(await file.text(), file.name);
      } catch (err) {
        document.getElementById("error").textContent = String(err);
        setStatus("Failed.");
      }
    };

    async function installMRzeroCloud(pyodide) {
      const errors = [];
      for (const root of packageRoots()) {
        const probe = new URL("MRzeroCloud/__init__.py", root).href;
        try {
          const files = [];
          for (const rel of PACKAGE_FILES) {
            files.push({ rel, text: await fetchText(new URL(rel, root).href) });
          }
          for (const { rel, text } of files) {
            mkdirParents(pyodide.FS, rel);
            pyodide.FS.writeFile(rel, text);
          }
          setStatus("Loaded MRzeroCloud from " + root);
          return;
        } catch (err) {
          errors.push(`${probe}: ${errText(err)}`);
        }
      }
      throw new Error(
        "Could not fetch the MRzeroCloud package from this server.\n" +
          "Serve the folder that contains both examples/ and MRzeroCloud/.\n" +
          errors.join("\n")
      );
    }

    async function main() {
      pyodide = await loadPyodide();
      setStatus("Loading numpy / Pillow / scipy / micropip…");
      await pyodide.loadPackage(["numpy", "Pillow", "scipy", "micropip"]);

      setStatus("Installing requests and pynufft…");
      await pyodide.runPythonAsync(`
import micropip
await micropip.install(["requests", "pynufft"])
      `);

      setStatus("Loading MRzeroCloud from this server…");
      await installMRzeroCloud(pyodide);
      setBusy(false);
      setStatus("Ready — upload a .seq or run the GRE example.");
    }

    main().catch((err) => {
      document.getElementById("error").textContent = String(err);
      setStatus("Failed.");
    });
  </script>
</body>
</html>
